<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07090f;--surface:#0d1117;--surface2:#121a24;--surface3:#182130;
  --border:#1a2535;--border-hi:rgba(0,200,255,0.25);
  --text:#cdd6f4;--muted:#6272a4;--dim:#3d4f6b;
  --red:#ff2d55;--red-dim:rgba(255,45,85,0.15);
  --orange:#ff6b35;--orange-dim:rgba(255,107,53,0.15);
  --yellow:#ffd60a;--yellow-dim:rgba(255,214,10,0.12);
  --green:#30d158;--green-dim:rgba(48,209,88,0.12);
  --cyan:#00d4ff;--cyan-dim:rgba(0,212,255,0.10);
  --purple:#bf5af2;
  --font-display:'Rajdhani',sans-serif;
  --font-mono:'Share Tech Mono',monospace;
  --font-body:'Syne',sans-serif;
  --sidebar:220px;
}
html,body,#root{height:100%;background:var(--bg);color:var(--text);font-family:var(--font-body)}
body{overflow-x:hidden}
/* Scanline texture */
body::before{
  content:'';position:fixed;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.04) 2px,rgba(0,0,0,0.04) 4px);
  pointer-events:none;z-index:9999;
}
/* Scrollbar */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--surface)}
::-webkit-scrollbar-thumb{background:var(--border-hi);border-radius:2px}

/* Layout */
.app{display:flex;height:100%;min-height:100vh}
.sidebar{
  width:var(--sidebar);min-width:var(--sidebar);
  background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column;min-width:0}
.header{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:0 24px;height:56px;display:flex;align-items:center;gap:16px;
  position:sticky;top:0;z-index:100;
}
.content{padding:24px;flex:1}

/* Sidebar */
.sidebar-logo{
  padding:16px 16px 8px;
  border-bottom:1px solid var(--border);margin-bottom:8px;
}
.logo-title{
  font-family:var(--font-display);font-size:17px;font-weight:700;
  color:var(--cyan);letter-spacing:1px;line-height:1.2;
}
.logo-sub{font-family:var(--font-mono);font-size:9px;color:var(--muted);letter-spacing:2px;margin-top:2px}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 16px;font-family:var(--font-display);font-size:14px;font-weight:500;
  color:var(--muted);cursor:pointer;transition:all 0.15s;
  border-left:2px solid transparent;letter-spacing:0.5px;
}
.nav-item:hover{color:var(--text);background:var(--surface2)}
.nav-item.active{color:var(--cyan);border-left-color:var(--cyan);background:rgba(0,212,255,0.06)}
.nav-icon{font-size:14px;width:18px;text-align:center}
.nav-section{
  padding:8px 16px 4px;
  font-family:var(--font-mono);font-size:9px;letter-spacing:2px;
  color:var(--dim);text-transform:uppercase;
}
.sidebar-footer{
  margin-top:auto;padding:12px 16px;border-top:1px solid var(--border);
  font-family:var(--font-mono);font-size:9px;color:var(--dim);
}

/* Header */
.header-title{
  font-family:var(--font-display);font-size:16px;font-weight:700;
  color:var(--text);letter-spacing:1px;flex:1;
}
.status-pill{
  display:flex;align-items:center;gap:6px;
  padding:4px 10px;border-radius:20px;
  font-family:var(--font-mono);font-size:10px;letter-spacing:1px;
  border:1px solid;
}
.status-pill.idle{color:var(--green);border-color:var(--green);background:var(--green-dim)}
.status-pill.running{color:var(--yellow);border-color:var(--yellow);background:var(--yellow-dim)}
.pulse{
  width:7px;height:7px;border-radius:50%;background:currentColor;
  animation:pulse 1.5s infinite;
}
.pulse.running{animation-duration:0.7s}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.run-btn{
  padding:6px 14px;background:var(--red-dim);border:1px solid var(--red);
  color:var(--red);border-radius:4px;font-family:var(--font-mono);font-size:10px;
  letter-spacing:1px;cursor:pointer;transition:all 0.15s;
  text-transform:uppercase;
}
.run-btn:hover{background:var(--red);color:#fff}
.run-btn:disabled{opacity:0.4;cursor:not-allowed}
.last-scan{font-family:var(--font-mono);font-size:10px;color:var(--muted)}

/* Metric cards */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:24px}
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:6px;
  padding:16px;position:relative;overflow:hidden;
  transition:border-color 0.2s;
}
.card:hover{border-color:var(--border-hi)}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:var(--card-accent,var(--cyan));
}
.card-label{
  font-family:var(--font-mono);font-size:9px;letter-spacing:2px;
  color:var(--muted);text-transform:uppercase;margin-bottom:8px;
}
.card-value{
  font-family:var(--font-display);font-size:36px;font-weight:700;
  color:var(--card-accent,var(--cyan));line-height:1;
}
.card-sub{
  font-family:var(--font-mono);font-size:10px;color:var(--muted);margin-top:4px;
}

/* Charts area */
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
.chart-panel{
  background:var(--surface);border:1px solid var(--border);border-radius:6px;
  padding:16px;
}
.chart-title{
  font-family:var(--font-display);font-size:13px;font-weight:600;
  letter-spacing:1px;color:var(--muted);text-transform:uppercase;
  margin-bottom:16px;display:flex;align-items:center;gap:8px;
}
.chart-title::before{content:'▶';font-size:8px;color:var(--cyan)}

/* Severity badges */
.badge{
  display:inline-flex;align-items:center;padding:2px 8px;
  border-radius:3px;font-family:var(--font-mono);font-size:10px;
  letter-spacing:1px;font-weight:500;text-transform:uppercase;border:1px solid;
}
.badge.critical{color:var(--red);border-color:var(--red);background:var(--red-dim)}
.badge.high{color:var(--orange);border-color:var(--orange);background:var(--orange-dim)}
.badge.medium{color:var(--yellow);border-color:var(--yellow);background:var(--yellow-dim)}
.badge.low{color:var(--green);border-color:var(--green);background:var(--green-dim)}
.badge.gap{color:var(--red);border-color:var(--red);background:var(--red-dim)}
.badge.detected{color:var(--green);border-color:var(--green);background:var(--green-dim)}
.badge.partial{color:var(--yellow);border-color:var(--yellow);background:var(--yellow-dim)}

/* Table */
.table-wrap{
  background:var(--surface);border:1px solid var(--border);border-radius:6px;overflow:hidden;
}
.table-header{
  padding:12px 16px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--surface2);
}
.table-title{font-family:var(--font-display);font-size:13px;font-weight:600;letter-spacing:1px;text-transform:uppercase}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filter-select{
  background:var(--surface3);border:1px solid var(--border);border-radius:3px;
  color:var(--text);font-family:var(--font-mono);font-size:10px;
  padding:4px 8px;outline:none;cursor:pointer;
}
table{width:100%;border-collapse:collapse}
thead th{
  padding:10px 12px;text-align:left;
  font-family:var(--font-mono);font-size:9px;letter-spacing:2px;
  color:var(--dim);text-transform:uppercase;border-bottom:1px solid var(--border);
  background:var(--surface2);white-space:nowrap;cursor:pointer;user-select:none;
}
thead th:hover{color:var(--cyan)}
tbody tr{border-bottom:1px solid var(--border);transition:background 0.1s}
tbody tr:hover{background:var(--surface2)}
tbody td{
  padding:9px 12px;font-family:var(--font-mono);font-size:11px;
  color:var(--text);vertical-align:middle;
}
.td-id{color:var(--cyan);font-size:10px}
.td-muted{color:var(--muted)}
.score-bar-wrap{display:flex;align-items:center;gap:6px}
.score-bar{height:4px;border-radius:2px;background:var(--cyan);opacity:0.8}
.score-num{font-size:10px;color:var(--muted);min-width:30px}
.poc-check{color:var(--green)}

/* Detector feed */
.feed{display:flex;flex-direction:column;gap:8px}
.alert-item{
  background:var(--surface);border:1px solid var(--border);border-radius:5px;
  padding:12px 14px;display:flex;align-items:flex-start;gap:12px;
  transition:border-color 0.15s;
}
.alert-item:hover{border-color:var(--border-hi)}
.alert-item.critical{border-left:3px solid var(--red)}
.alert-item.high{border-left:3px solid var(--orange)}
.alert-item.medium{border-left:3px solid var(--yellow)}
.alert-item.low{border-left:3px solid var(--green)}
.alert-source{
  font-family:var(--font-mono);font-size:9px;letter-spacing:1px;
  color:var(--dim);text-transform:uppercase;padding:2px 6px;
  border:1px solid var(--border);border-radius:2px;white-space:nowrap;margin-top:1px;
}
.alert-source.rule_engine{color:var(--cyan);border-color:var(--cyan)}
.alert-source.sigma_correlator{color:var(--purple);border-color:var(--purple)}
.alert-source.ioc_matcher{color:var(--orange);border-color:var(--orange)}
.alert-source.anomaly_detector{color:var(--yellow);border-color:var(--yellow)}
.alert-source.llm{color:var(--green);border-color:var(--green)}
.alert-body{flex:1;min-width:0}
.alert-title{
  font-family:var(--font-display);font-size:13px;font-weight:600;
  color:var(--text);margin-bottom:3px;
}
.alert-desc{
  font-family:var(--font-mono);font-size:10px;color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.alert-meta{
  display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap;
}
.meta-tag{
  font-family:var(--font-mono);font-size:9px;color:var(--dim);
  padding:1px 5px;border:1px solid var(--border);border-radius:2px;
}
.conf-bar{display:flex;align-items:center;gap:4px}
.conf-pip{width:5px;height:5px;border-radius:50%}

/* Remediation cards */
.rem-section{margin-bottom:20px}
.rem-section-title{
  font-family:var(--font-display);font-size:11px;letter-spacing:2px;text-transform:uppercase;
  color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:8px;
}
.rem-section-title::after{content:'';flex:1;height:1px;background:var(--border)}
.rem-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.rem-card{
  background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:14px;
}
.rem-card-title{
  font-family:var(--font-display);font-size:13px;font-weight:600;color:var(--text);
  margin-bottom:8px;line-height:1.3;
}
.rem-card-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.rem-card-controls{
  font-family:var(--font-mono);font-size:10px;color:var(--muted);

.rem-card-controls li{margin-left:14px;margin-bottom:2px;color:var(--dim)}
.owner-badge{
  font-family:var(--font-mono);font-size:9px;padding:2px 7px;
  border-radius:10px;border:1px solid;
}
.owner-badge.security{color:var(--red);border-color:var(--red)}
.owner-badge.platform{color:var(--cyan);border-color:var(--cyan)}
.owner-badge.engineering{color:var(--green);border-color:var(--green)}

  font-family:var(--font-mono);font-size:9px;padding:2px 7px;
  border-radius:10px;border:1px solid var(--border);color:var(--muted);
}

/* Engine stats */
.engine-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:20px}
.engine-card{
  background:var(--surface);border:1px solid var(--border);border-radius:5px;
  padding:12px;text-align:center;
}
.engine-num{
  font-family:var(--font-display);font-size:28px;font-weight:700;
  color:var(--cyan);line-height:1;
}
.engine-label{
  font-family:var(--font-mono);font-size:9px;color:var(--muted);
  letter-spacing:1px;text-transform:uppercase;margin-top:4px;
}

/* Evidence */
.evd-item{
  background:var(--surface);border:1px solid var(--border);border-radius:5px;
  padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:border-color 0.15s;
}
.evd-item:hover{border-color:var(--border-hi)}
.evd-id{font-family:var(--font-mono);font-size:10px;color:var(--cyan)}
.evd-type{
  font-family:var(--font-mono);font-size:9px;padding:1px 6px;
  border:1px solid var(--border);border-radius:2px;color:var(--muted);
}
.evd-detail{
  background:var(--surface3);border:1px solid var(--border);
  border-radius:3px;padding:10px;margin-top:8px;
  font-family:var(--font-mono);font-size:10px;color:var(--muted);
  max-height:200px;overflow-y:auto;word-break:break-all;white-space:pre-wrap;
}

/* Misc */
.section-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;
}
.section-title{
  font-family:var(--font-display);font-size:18px;font-weight:700;
  letter-spacing:1px;color:var(--text);
}
.section-sub{font-family:var(--font-mono);font-size:10px;color:var(--muted);margin-top:2px}
.empty{
  padding:40px;text-align:center;
  font-family:var(--font-mono);font-size:12px;color:var(--dim);
}
.loading{
  padding:60px;text-align:center;
  font-family:var(--font-mono);font-size:12px;color:var(--muted);
  letter-spacing:2px;
}
.loading::after{content:'...';animation:dots 1.5s infinite}
@keyframes dots{0%{content:'...'}33%{content:'.'}66%{content:'..'}100%{content:'...'}}
.llm-box{
  background:rgba(48,209,88,0.05);border:1px solid rgba(48,209,88,0.2);
  border-radius:5px;padding:14px;margin-bottom:20px;
}
.llm-title{
  font-family:var(--font-display);font-size:12px;font-weight:600;
  color:var(--green);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;
  display:flex;align-items:center;gap:6px;
}
.llm-title::before{content:'🤖';font-size:12px}
.llm-text{font-family:var(--font-mono);font-size:11px;color:var(--muted);line-height:1.5}
.tag-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag{
  font-family:var(--font-mono);font-size:9px;padding:1px 6px;
  border-radius:10px;background:var(--surface2);border:1px solid var(--border);
  color:var(--dim);
}
.tab-row{display:flex;gap:2px;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--border)}
.tab{
  padding:12px 16px;font-family:var(--font-display);font-size:12px;
  font-weight:600;letter-spacing:1px;text-transform:uppercase;
  color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all 0.15s;
}
.tab.active{color:var(--cyan);border-bottom-color:var(--cyan)}
.tab:hover{color:var(--text)}
</style>

// ─── Findings Table ────────────────────────────────────────────────────────────
function Findings() {
  const [data,setData]=useState(null);
  const [sev,setSev]=useState('');
  const [det,setDet]=useState('');
  const [sort,setSort]=useState({key:'score',dir:-1});
  useEffect(()=>{API.get(`findings?severity=${sev}&detection_status=${det}&limit=50`).then(setData);},[sev,det]);
  const toggle=(k)=>setSort(s=>s.key===k?{key:k,dir:s.dir*-1}:{key:k,dir:-1});
  const sorted=(data?.findings||[]).slice().sort((a,b)=>{
    const av=a[sort.key]??'',bv=b[sort.key]??'';
    return typeof av==='number'?((av-bv)*sort.dir):(String(av).localeCompare(String(bv))*sort.dir);
  });
  const arrow=(k)=>sort.key===k?(sort.dir>0?'▲':'▼'):'';
  return <>
    <div className="section-header">
      <div>
        <div className="section-title">Hallazgos</div>
        <div className="section-sub">{data?.total||0} total · {data?.count||0} mostrando</div>
      </div>
    </div>
    <div className="table-wrap">
      <div className="table-header">
        <span className="table-title">Findings</span>
        <div className="filters">
          <select className="filter-select" value={sev} onChange={e=>{setSev(e.target.value);setData(null)}}>
            <option value="">All Severity</option>
            {['critical','high','medium','low'].map(s=><option key={s} value={s}>{s}</option>)}
          </select>
          <select className="filter-select" value={det} onChange={e=>{setDet(e.target.value);setData(null)}}>
            <option value="">All Detection</option>
            {['gap','detected','partial'].map(s=><option key={s} value={s}>{s}</option>)}
          </select>
        </div>
      </div>
      {!data?<div className="loading">Cargando hallazgos</div>:<table>
        <thead><tr>
          {[['id','ID'],['asset','ACTIVO'],['technique_id','ATT&CK'],['severity','SEVERIDAD'],['detection_status','DETECCIÓN'],['poc_id','POC'],['score','SCORE']].map(([k,l])=>
            <th key={k} onClick={()=>toggle(k)}>{l} {arrow(k)}</th>)}
        </tr></thead>
        <tbody>{sorted.map(f=><tr key={f.id}>
          <td><span className="td-id">{f.id.replace('FND-SCN-','')}</span></td>
          <td><span style={{color:'var(--text)',fontSize:10}}>{f.asset}</span></td>
          <td><span style={{color:'var(--cyan)',fontFamily:'Share Tech Mono',fontSize:10}}>{f.technique_id}</span></td>
          <td><Badge val={f.severity}/></td>
          <td><Badge val={f.detection_status}/></td>
          <td>{f.poc_id?<span className="poc-check">✓</span>:<span className="td-muted">—</span>}</td>
          <td><div className="score-bar-wrap">
            <div className="score-bar" style={{width:`${f.score}px`,maxWidth:80}}/>
            <span className="score-num">{f.score}</span>
          </div></td>
        </tr>)}</tbody>
      </table>}
    </div>
  </>;
}

      {data?.new_rules_suggested?.length>0&&<div className="tag-row">
        <span style={{fontFamily:'Share Tech Mono',fontSize:9,color:'var(--dim)'}}>NUEVAS REGLAS:</span>
        {data.new_rules_suggested.map((r,i)=><span key={i} className="tag">{r.name||r.id}</span>)}
      </div>}
    </div>}
    <div className="tab-row" style={{margin:'0 -24px',padding:'0 24px'}}>
      {[['alerts',`Alertas (${alerts.length})`],['rules','Reglas'],['iocs','IoCs']].map(([id,label])=>
        <div key={id} className={`tab ${tab===id?'active':''}`} onClick={()=>setTab(id)}>{label}</div>)}
    </div>
    <div style={{height:20}}/>
    {tab==='alerts'&&<div className="feed">
      {loading?<div className="loading">Ejecutando detectores</div>:
       alerts.length===0?<div className="empty">Sin alertas generadas aún. Ejecuta un scan primero.</div>:
       alerts.map(a=><div key={a.id} className={`alert-item ${a.severity}`}>
        <span className={`alert-source ${a.source}`}>{SOURCE_LABELS[a.source]||a.source}</span>
        <div className="alert-body">
          <div className="alert-title">{a.title}</div>
          <div className="alert-desc">{a.description}</div>
          <div className="alert-meta">
            <Badge val={a.severity}/>
            {a.technique_ids?.slice(0,3).map(t=><span key={t} className="meta-tag">{t}</span>)}
            <span className="meta-tag">conf: {(a.confidence*100).toFixed(0)}%</span>
            <Conf v={a.confidence}/>
            {a.asset_id&&a.asset_id!=='unknown'&&<span className="meta-tag">↪ {a.asset_id}</span>}
            {a.requires_llm_review&&<span style={{fontFamily:'Share Tech Mono',fontSize:9,color:'var(--green)'}}>🤖 LLM</span>}
          </div>
          {a.llm_hypothesis&&<div style={{fontFamily:'Share Tech Mono',fontSize:10,color:'var(--green)',marginTop:6,padding:'4px 8px',background:'rgba(48,209,88,0.05)',borderRadius:3}}>{a.llm_hypothesis}</div>}
        </div>
        <span style={{fontFamily:'Share Tech Mono',fontSize:9,color:'var(--dim)',whiteSpace:'nowrap',marginTop:1}}>{a.detected_at?.substring(11,19)||''}</span>
      </div>)}
    </div>}
    {tab==='rules'&&<div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:8}}>
        {RULE_NAMES.map((name,i)=><div key={i} style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:4,padding:10}}>
          <div style={{color:'var(--cyan)',fontSize:9,letterSpacing:1,fontFamily:'Share Tech Mono'}}>RULE-{String(i+1).padStart(3,'0')}</div>
          <div style={{color:'var(--text)',fontSize:11,marginTop:3,fontFamily:'var(--font-display)',fontWeight:600}}>{name}</div>
          <div style={{color:'var(--dim)',fontSize:9,marginTop:4,fontFamily:'Share Tech Mono'}}>determinístico · regex</div>
        </div>)}
        {(data?.new_rules_suggested||[]).map((r,i)=><div key={`llm${i}`} style={{background:'var(--surface)',border:'1px solid rgba(48,209,88,0.25)',borderRadius:4,padding:10}}>
          <div style={{color:'var(--green)',fontSize:9,letterSpacing:1,fontFamily:'Share Tech Mono'}}>{r.id||`RULE-LLM-${i}`}</div>
          <div style={{color:'var(--text)',fontSize:11,marginTop:3,fontFamily:'var(--font-display)',fontWeight:600}}>{r.name||'LLM Rule'}</div>
          <div style={{color:'var(--green)',fontSize:9,marginTop:4,fontFamily:'Share Tech Mono'}}>generada por RDT</div>
        </div>)}
      </div>
    </div>}
    {tab==='iocs'&&<div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:8}}>
        {IOC_VALUES.map((ioc,i)=><div key={i} style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:4,padding:10}}>
          <div style={{color:'var(--orange)',fontSize:9,letterSpacing:1,fontFamily:'Share Tech Mono'}}>IOC-{String(i+1).padStart(3,'0')}</div>
          <div style={{color:'var(--text)',fontSize:10,marginTop:3,wordBreak:'break-all',fontFamily:'Share Tech Mono'}}>{ioc}</div>
          <div style={{color:'var(--dim)',fontSize:9,marginTop:4,fontFamily:'Share Tech Mono'}}>lab_internal · determinístico</div>
        </div>)}
      </div>
    </div>}
  </>;
}

// ─── Kill Chains ────────────────────────────────────────────────────────────────
const TACTICS = [
  'Reconnaissance','Initial Access','Execution','Persistence',
  'Privilege Escalation','Defense Evasion','Credential Access',
  'Discovery','Lateral Movement','Collection','Exfiltration','Impact',
];
const TECH_TACTIC = {
  T1190:'Initial Access',T1078:'Initial Access',T1059:'Execution',
  T1053:'Persistence',T1548:'Privilege Escalation',T1562:'Defense Evasion',
  T1003:'Credential Access',T1082:'Discovery',T1005:'Collection',
  T1021:'Lateral Movement',T1041:'Exfiltration',T1499:'Impact',
};
const CHAIN_STEPS = ['Initial Access','Execution','Persistence','Defense Evasion','Credential Access','Impact'];

function Chains({summary}) {
  const [data,setData]=useState(null);
  const [expanded,setExpanded]=useState(null);
  useEffect(()=>{API.get('chains').then(d=>setData(d||summary));},[]);
  const src=data||summary||{};
  const chains=src.chains_simulated||0;
  const topFindings=src.top_findings||[];
  const coveredTactics=new Set(topFindings.map(f=>TECH_TACTIC[f.technique_id]).filter(Boolean));
  return <>
    <div className="section-header">
      <div>
        <div className="section-title">Kill Chains</div>
        <div className="section-sub">{chains} cadenas simuladas · profundidad máxima 6</div>
      </div>
    </div>
    <div className="chart-panel" style={{marginBottom:20}}>
      <div className="chart-title">ATT&CK Tactic Coverage</div>
      <div style={{display:'flex',gap:6,flexWrap:'wrap',padding:'4px 0'}}>
        {TACTICS.map(t=>{
          const covered=coveredTactics.has(t);
          return <div key={t} style={{
            padding:'6px 12px',borderRadius:4,fontSize:10,fontFamily:'Share Tech Mono',letterSpacing:.5,
            background:covered?'rgba(0,212,255,0.1)':'var(--surface2)',
            border:`1px solid ${covered?'var(--cyan)':'var(--border)'}`,
            color:covered?'var(--cyan)':'var(--dim)',
          }}>{t}</div>;
        })}
      </div>
    </div>
    {topFindings.length===0
      ? <div className="empty">Sin kill chains. Ejecuta un scan primero.</div>
      : <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(340px,1fr))',gap:12}}>
          {topFindings.slice(0,8).map((f,i)=>{
            const open=expanded===i;
            return <div key={f.id}
              style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:6,padding:14,cursor:'pointer'}}
              onClick={()=>setExpanded(open?null:i)}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:10}}>
                <div>
                  <div style={{fontFamily:'Share Tech Mono',fontSize:9,color:'var(--dim)'}}>CHAIN #{i+1}</div>
                  <div style={{fontFamily:'var(--font-display)',fontWeight:700,fontSize:14,marginTop:2}}>{f.technique_id} on {f.asset}</div>
                </div>
                <Badge val={f.severity}/>
              </div>
              <div style={{borderLeft:'2px solid var(--border)',paddingLeft:12}}>
                {(open?CHAIN_STEPS:CHAIN_STEPS.slice(0,3)).map((step,si)=>(
                  <div key={si} style={{display:'flex',alignItems:'center',gap:8,marginBottom:6,position:'relative'}}>
                    <div style={{width:8,height:8,borderRadius:'50%',position:'absolute',left:-17,
                      background:si===0?'var(--cyan)':'var(--border)',border:'1px solid var(--cyan)'}}/>
                    <span style={{fontFamily:'Share Tech Mono',fontSize:9,letterSpacing:.5,color:si===0?'var(--cyan)':'var(--dim)'}}>{step}</span>
                    {si===0&&<span style={{fontFamily:'Share Tech Mono',fontSize:9,color:'var(--text)'}}>{f.technique_id}</span>}
                  </div>
                ))}
                {!open&&<div style={{fontFamily:'Share Tech Mono',fontSize:9,color:'var(--dim)',marginTop:4}}>+ {CHAIN_STEPS.length-3} pasos más ▾</div>}
              </div>
              <div style={{marginTop:10,paddingTop:8,borderTop:'1px solid var(--border)',display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
                <span className="meta-tag">score: {f.score}</span>
                <Badge val={f.detection_status}/>
                {f.poc_id&&<span style={{fontFamily:'Share Tech Mono',fontSize:9,color:'var(--green)'}}>✓ PoC</span>}
              </div>
              {open&&<div style={{marginTop:12,padding:'10px',background:'var(--surface3)',borderRadius:4,fontFamily:'Share Tech Mono',fontSize:10,color:'var(--muted)',lineHeight:1.6}}>
                <div><strong style={{color:'var(--cyan)'}}>Asset:</strong> {f.asset}</div>
                <div><strong style={{color:'var(--cyan)'}}>Técnica:</strong> {f.technique_id}</div>
                <div><strong style={{color:'var(--cyan)'}}>Tactic:</strong> {TECH_TACTIC[f.technique_id]||'—'}</div>
                <div style={{marginTop:6,color:'var(--dim)'}}>{f.summary}</div>
              </div>}
            </div>;
          })}
        </div>
    }
  </>;
}

// ─── Remediation Board ─────────────────────────────────────────────────────────
function Remediation() {
  const [data,setData]=useState(null);
  useEffect(()=>{API.get('remediation').then(setData);},[]);
  if (!data) return <div className="loading">Cargando backlog</div>;
  const {by_priority:bp={},summary:s={}} = data;
  const sections=[
    {key:'critical',label:'🔴 Crítico (SLA 1 día)',color:'var(--red)'},
    {key:'high',label:'🟠 Alto (SLA 7 días)',color:'var(--orange)'},
    {key:'medium',label:'🟡 Medio (SLA 30 días)',color:'var(--yellow)'},
    {key:'low',label:'🟢 Bajo (SLA 90 días)',color:'var(--green)'},
  ];
  return <>
    <div className="section-header">
      <div>
        <div className="section-title">Backlog de Remediación</div>
        <div className="section-sub">{s.open||0} tickets abiertos · {JSON.stringify(s.by_owner||{})}</div>
      </div>
    </div>
    {sections.map(({key,label,color})=>(bp[key]||[]).length>0&&<div key={key} className="rem-section">
      <div className="rem-section-title" style={{color}}>{label}</div>
      <div className="rem-cards">
        {(bp[key]||[]).map(t=><div key={t.id} className="rem-card" style={{borderTop:`2px solid ${color}`}}>
          <div className="rem-card-title">{t.title?.replace(/^\[.*?\]\s*/,'')}</div>
          <div className="rem-card-meta">
            <span className={`owner-badge ${t.owner_team}`}>{t.owner_team}</span>
            <span className="sla-tag">SLA: {t.sla_days}d</span>
            <Badge val={t.status||'open'} label={t.status||'open'}/>
          </div>
          {t.controls_to_apply?.length>0&&<>
            <div style={{fontFamily:'Share Tech Mono',fontSize:9,color:'var(--dim)',letterSpacing:1,marginBottom:4}}>CONTROLES:</div>
            <ul className="rem-card-controls">{t.controls_to_apply.slice(0,3).map((c,i)=><li key={i}>{c}</li>)}</ul>
          </>}
          {t.detection_rules_needed?.length>0&&<>
            <div style={{fontFamily:'Share Tech Mono',fontSize:9,color:'var(--dim)',letterSpacing:1,margin:'8px 0 4px'}}>REGLAS DE DETECCIÓN:</div>
            <ul className="rem-card-controls">{t.detection_rules_needed.slice(0,2).map((r,i)=><li key={i} style={{color:r.startsWith('PRIORITY')?'var(--red)':'var(--dim)'}}>{r}</li>)}</ul>
          </>}
        </div>)}
      </div>
    </div>)}
  </>;
}

// ─── Evidence Browser ──────────────────────────────────────────────────────────
function Evidence() {
  const [data,setData]=useState(null);
  const [open,setOpen]=useState(null);
  const [typeFilter,setTypeFilter]=useState('');
  useEffect(()=>{API.get(`evidence?limit=30&evidence_type=${typeFilter}`).then(setData);},[typeFilter]);
  const records=data?.records||[];
  const summary=data?.summary||{};
  return <>
    <div className="section-header">
      <div>
        <div className="section-title">Evidence Engine</div>
        <div className="section-sub">{summary.total_records||0} registros · SHA-256 + chain of custody</div>
      </div>
      <div className="filters">
        <select className="filter-select" value={typeFilter} onChange={e=>{setTypeFilter(e.target.value);setData(null)}}>
          <option value="">All Types</option>
          {['stdout','log','poc','chain_step','evasion'].map(t=><option key={t} value={t}>{t}</option>)}
        </select>
      </div>
    </div>
    <div className="cards-grid" style={{gridTemplateColumns:'repeat(auto-fill,minmax(160px,1fr))'}}>
      {Object.entries(summary.by_type||{}).map(([k,v])=><div key={k} className="card" style={{'--card-accent':'var(--cyan)'}}>
        <div className="card-label">{k}</div>
        <div className="card-value" style={{fontSize:28}}>{v}</div>
      </div>)}
      {summary.assets_covered&&<div className="card" style={{'--card-accent':'var(--green)'}}>
        <div className="card-label">Assets</div>
        <div className="card-value" style={{fontSize:28}}>{summary.assets_covered}</div>
      </div>}
      {summary.techniques_covered&&<div className="card" style={{'--card-accent':'var(--purple)'}}>
        <div className="card-label">Técnicas</div>
        <div className="card-value" style={{fontSize:28}}>{summary.techniques_covered}</div>
      </div>}
    </div>
    {records.length===0?<div className="empty">Sin registros de evidencia. Ejecuta un scan primero.</div>:
     records.map(r=><div key={r.id} className="evd-item" onClick={()=>setOpen(open===r.id?null:r.id)}>
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:6}}>
        <span className="evd-id">{r.id}</span>
        <span className="evd-type">{r.evidence_type}</span>
        <span style={{fontFamily:'Share Tech Mono',fontSize:9,color:'var(--dim)'}}>asset: {r.asset_id}</span>
        <span style={{fontFamily:'Share Tech Mono',fontSize:9,color:'var(--dim)'}}>tech: {r.technique_id}</span>
        <span style={{marginLeft:'auto',fontFamily:'Share Tech Mono',fontSize:9,color:'var(--dim)'}}>SHA: {r.hash_sha256?.substring(0,12)}…</span>
      </div>
      <div style={{fontFamily:'Share Tech Mono',fontSize:9,color:'var(--dim)'}}>
        collected by: {r.collector} · {r.collected_at?.substring(0,19)||''}
      </div>
      {open===r.id&&<div className="evd-detail">
        {r.chain_of_custody?.map((c,i)=><div key={i} style={{color:'var(--green)',marginBottom:2}}>▸ {c}</div>)}
        <div style={{marginTop:8,borderTop:'1px solid var(--border)',paddingTop:8}}>
          {typeof r.content==='string'?r.content.substring(0,500):JSON.stringify(r.content).substring(0,500)}
        </div>
      </div>}
    </div>)}
  </>;
}

// ─── App ────────────────────────────────────────────────────────────────────────
const PAGES = [
  {id:'overview',icon:'◈',label:'Overview'},
  {id:'findings',icon:'◉',label:'Findings'},
  {id:'detectors',icon:'⚡',label:'Detectores'},
  {id:'chains',icon:'⛓',label:'Kill Chains'},
  {id:'remediation',icon:'🛠',label:'Remediación'},
  {id:'evidence',icon:'📁',label:'Evidencia'},
];

function App() {
  const [page,setPage]=useState('overview');
  const [summary,setSummary]=useState(null);
  const [status,setStatus]=useState(null);
  const [metrics,setMetrics]=useState(null);
  const [scanning,setScanning]=useState(false);
  const poll=useRef(null);

  useEffect(()=>{
    Promise.all([API.get('summary'),API.get('status'),API.get('metrics')]).then(([s,st,m])=>{
      setSummary(s);setStatus(st);setMetrics(m);
    });
    poll.current=setInterval(()=>{
      API.get('status').then(st=>{
        setStatus(st);
        if(st?.status==='idle'&&scanning){setScanning(false);API.get('summary').then(setSummary);}
      });
    },5000);
    return ()=>clearInterval(poll.current);
  },[]);

  const runScan=async()=>{
    setScanning(true);
    await API.post('run');
  };

  const pageLabels={overview:'Resumen Ejecutivo',findings:'Hallazgos',detectors:'Detection Engine',chains:'Kill Chains',remediation:'Remediación',evidence:'Evidencia'};

  return <div className="app">
    <div className="sidebar">
      <div className="sidebar-logo">
        <div className="logo-title">AI CYBER RANGE</div>
        <div className="logo-sub">OFENSIVA CONTROLADA · IA</div>
      </div>
      <div className="nav-section">Análisis</div>
      {PAGES.slice(0,2).map(p=><div key={p.id} className={`nav-item ${page===p.id?'active':''}`} onClick={()=>setPage(p.id)}>
        <span className="nav-icon">{p.icon}</span>{p.label}
      </div>)}
      <div className="nav-section">Detección</div>
      {PAGES.slice(2,4).map(p=><div key={p.id} className={`nav-item ${page===p.id?'active':''}`} onClick={()=>setPage(p.id)}>
        <span className="nav-icon">{p.icon}</span>{p.label}
      </div>)}
      <div className="nav-section">Remediación</div>
      {PAGES.slice(4).map(p=><div key={p.id} className={`nav-item ${page===p.id?'active':''}`} onClick={()=>setPage(p.id)}>
        <span className="nav-icon">{p.icon}</span>{p.label}
      </div>)}
      <div className="sidebar-footer">
        <div>MITRE ATT&CK</div>
        <div style={{marginTop:2}}>v2.0 · {new Date().toLocaleDateString()}</div>
      </div>
    </div>
    <div className="main">
      <div className="header">
        <div className="header-title">{pageLabels[page]}</div>
        <div className="status-pill idle" style={scanning?{color:'var(--yellow)',borderColor:'var(--yellow)',background:'var(--yellow-dim)'}:{}}>
          <div className={`pulse ${scanning?'running':''}`}/>
          {scanning?'SCANNING…':'IDLE'}
        </div>
        <div className="last-scan">{status?.last_scan_at?.substring(0,19).replace('T',' ')||'—'}</div>
        <button className="run-btn" onClick={runScan} disabled={scanning}>{scanning?'RUNNING…':'▶ RUN SCAN'}</button>
      </div>
      <div className="content">
        {page==='overview'&&<Overview summary={summary} metrics={metrics}/>}
        {page==='findings'&&<Findings/>}
        {page==='detectors'&&<Detectors/>}
        {page==='chains'&&<Chains summary={summary}/>}
        {page==='remediation'&&<Remediation/>}
        {page==='evidence'&&<Evidence/>}
      </div>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
