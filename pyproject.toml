[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cyber-range"
version = "0.2.0-beta"
description = "AI Cyber Range — secure defensive validation and purple-team simulation"
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
keywords = ["cybersecurity", "purple-team", "mitre-attack", "defensive-validation"]

dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0",
    "pydantic>=2.0",
    "click>=8.1",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.9",
]
all = [
    "cyber-range[api,dev]",
]

[project.scripts]
cyber-range = "cyber_range.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cyber_range*"]

[tool.setuptools.package-data]
"cyber_range" = ["py.typed"]

# ── pytest ─────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths    = ["tests"]
addopts      = "-v --tb=short"
asyncio_mode = "auto"

# ── ruff ───────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

# ── mypy ───────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version   = "3.10"
strict           = false
ignore_missing_imports = true

# ── coverage ───────────────────────────────────────────────────────────────────
[tool.coverage.run]
# Measure only core modules — CLI/pipeline/api are integration-tested
source   = [
    "cyber_range.config",
    "cyber_range.policy",
    "cyber_range.scoring",
    "cyber_range.evidence",
    "cyber_range.reporting",
    "cyber_range.logging",
]
omit = ["*/tests/*", "*/test_*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
