program:
  name: "Sovereign AI Cyber Range — Ofensiva Controlada"
  version: "2.0"
  mode: "local_lab_only"
  allow_external_targets: false
  max_risk_level: "controlled_lab"
  continuous_mode: true
  cicd_trigger_enabled: true

sovereignty:
  model_policy: "local_or_enterprise_private_only"
  data_residency: "customer_controlled"
  jurisdiction: "configured_by_customer"
  audit_required: true
  evidence_retention_days: 90

rules_of_engagement:
  authorized_assets_only: true
  allowed_targets:
    - "local_c_lab_service"
    - "fixtures.synthetic_logs"
    - "fixtures.asset_graph"
    - "api_gateway_demo"
    - "pipeline_demo"
    - "cloud_storage_demo"
    - "iam_role_demo"
    - "secrets_store_demo"
  disallowed:
    - "public_ip_targets"
    - "credential_collection_against_real_users"
    - "persistence_on_real_systems"
    - "destructive_actions"
    - "external_exfiltration"

scoring:
  weights:
    severity: 0.40
    asset_criticality: 0.25
    detectability_gap: 0.20
    reproducibility: 0.15

offensive:
  max_chain_depth: 6
  enable_evasion_tests: true
  enable_chain_simulation: true
  enable_poc_generation: true
  min_hypothesis_confidence: 0.3

reporting:
  generate_markdown: true
  generate_json: true
  include_evidence_summary: true
  include_cicd_events: true
